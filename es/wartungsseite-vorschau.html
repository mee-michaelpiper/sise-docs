<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>Wartung · SiSe Portal</title>
<style>
  :root { --primary:#24366e; --tint:#eceef5; --bg:#f4f6f9; --surface:#ffffff; --text:#131c38; --muted:#565656; --line:#e7eaee; }
  @media (prefers-color-scheme: dark) {
    :root { --primary:#5b7cc5; --tint:rgba(91,124,197,.18); --bg:#0f1420; --surface:#171d2e; --text:#e6e9f2; --muted:#a3a9b8; --line:#2a3350; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:Roboto,Arial,Helvetica,sans-serif; display:flex; flex-direction:column; }
  header { background:#24366e; color:#fff; height:56px; display:flex; align-items:center; gap:14px; padding:0 20px; }
  header img { display:block; }
  .brand-text { font-weight:700; font-size:18px; }
  .title { font-size:15px; font-weight:500; white-space:nowrap; }
  main { flex:1; display:flex; align-items:flex-start; justify-content:center; padding:64px 16px; }
  .card { width:100%; max-width:560px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:32px; text-align:center; }
  .icon { width:64px; height:64px; border-radius:16px; background:var(--tint); color:var(--primary); display:inline-flex; align-items:center; justify-content:center; margin-bottom:16px; }
  h1 { font-family:Rubik,Tahoma,Arial,sans-serif; font-size:24px; margin:0 0 12px; overflow-wrap:anywhere; hyphens:auto; }
  .message { font-size:15px; line-height:1.6; margin:0; }
  .until { margin:12px 0 0; font-weight:600; }
  .hint { margin:20px 0 0; font-size:13px; color:var(--muted); }
  button { margin-top:20px; background:var(--primary); color:#fff; border:0; border-radius:4px; padding:9px 18px; font:inherit; font-size:14px; font-weight:500; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  @media (max-width: 480px) {
    header { padding:0 16px; gap:10px; }
    header img { height:26px; width:auto; }
    main { padding:24px 16px; }
    .card { padding:24px 16px; }
    h1 { font-size:20px; }
  }
</style>
</head>
